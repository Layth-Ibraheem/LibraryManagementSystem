# Local development and tests: in-memory H2, recreated on every start. Zero setup.
# ddl-auto is deliberately not set: Spring Boot then uses create-drop for an embedded database
# and none for any other one. H2ProfileGuard also stops the startup if this profile is pointed
# at a non-embedded database (for example SPRING_DATASOURCE_URL without SPRING_PROFILES_ACTIVE).
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PUBLIC, dev-only JWT signing key. It is committed on purpose and must never be used
# outside local development; production supplies its own key through JWT_SECRET.
jwt.secret=dev-only-aikjH5rg5OP8kMcS3EzjeMNXuAj12DXBMi9wDUGnEXHiLo13d0dyBA

# PUBLIC, dev-only passwords for the users that DevUserSeeder creates in this profile:
# admin (all permissions) and clerk (ManagePatrons). No other profile seeds users.
app.seed.admin-password=dev-only-admin-password
app.seed.clerk-password=dev-only-clerk-password
