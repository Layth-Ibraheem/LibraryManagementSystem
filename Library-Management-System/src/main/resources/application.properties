spring.application.name=Library-Management-System

# Shared settings only. Database settings live in the profile files:
#   application-h2.properties        in-memory H2, used when no profile is chosen
#   application-sqlserver.properties SQL Server, credentials from environment variables
spring.profiles.default=h2

# JWT. The signing key (jwt.secret) has no default here: the h2 profile sets a public
# dev-only key, and every other environment must supply JWT_SECRET (at least 32 characters).
jwt.expiration=10h

# Do not keep the persistence context open while the response is rendered. Services load
# what each response needs inside their own transaction, so lazy loading cannot hide N+1 queries.
spring.jpa.open-in-view=false
