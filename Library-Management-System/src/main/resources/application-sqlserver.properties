# SQL Server. Activate with SPRING_PROFILES_ACTIVE=sqlserver.
# No secrets are stored here; Spring binds them from environment variables (relaxed binding):
#   SPRING_DATASOURCE_USERNAME -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD -> spring.datasource.password
#   JWT_SECRET                 -> jwt.secret (required: startup fails without it)
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=LibraryManagementSystemDB;encrypt=true;trustServerCertificate=true
spring.jpa.hibernate.ddl-auto=update
