name: build

on:
  push:
  pull_request:

# The job only checks out the code and runs the tests, so the token needs read access only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Library-Management-System
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests run on the default h2 profile: in-memory database, no secrets needed.
      - name: Run tests
        run: ./mvnw -B test
